<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="End of RituVerse — keep building">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#03050c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="120" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="120" fill="url(#fade)"/>
    <g fill="#e2e8f0">
      <circle cx="80" cy="30" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="90" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="22" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="24" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="92" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="36" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="200" y="36" width="800" height="1.5" fill="url(#line)"/>
    <text x="600" y="72" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" letter-spacing="2" fill="#94a3b8">
      <tspan fill="#8b5cf6">while</tspan> (alive) { learn(); build(); grow(); }
    </text>
    <text x="600" y="100" text-anchor="middle" font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="4" fill="url(#g)" filter="url(#glow)">RITUVERSE · THE GIRL WHO BUILDS</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="118.5" rx="18" fill="none" stroke="#22d3ee" stroke-opacity="0.25"/>
</svg>
