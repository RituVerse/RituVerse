<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Project: Personal Portfolio">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#22d3ee" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="clip"><rect width="900" height="210" rx="16"/></clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="210" fill="url(#panel)"/>
    <rect width="900" height="210" fill="url(#grid)"/>
    <ellipse cx="900" cy="0" rx="495" ry="189" fill="url(#halo)"/>
    <rect x="0" y="0" width="900" height="2" fill="#22d3ee" fill-opacity="0.9"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="209" rx="16" fill="none" stroke="url(#border)"/>
  <text x="26" y="36" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12" letter-spacing="3" fill="#22d3ee">PROJECT 01</text>
  <text x="874" y="36" text-anchor="end" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11.5" fill="#64748b">RituVerse/my-portfolio</text>
  <text x="26" y="72" font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#f1f5f9">Personal Portfolio</text>
  <rect x="276" y="54" width="86" height="22" rx="11" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.6"/>
  <text x="319" y="69" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="10.5" letter-spacing="2" fill="#22d3ee">FEATURED</text>
  <text x="26" y="102" font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#cbd5e1">A dark, futuristic portfolio built from scratch with zero frameworks.</text>
  <text x="26" y="122" font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Particle-network canvas background, typing animation, scroll-reveal sections,</text>
  <text x="26" y="142" font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#cbd5e1">3D tilt project cards, animated skill bars and a mobile hamburger menu.</text>
  <rect x="26" y="160" width="53" height="24" rx="7" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.4"/>
  <text x="52.5" y="176" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#e2e8f0">HTML5</text>
  <rect x="87" y="160" width="46" height="24" rx="7" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.4"/>
  <text x="110.0" y="176" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#e2e8f0">CSS3</text>
  <rect x="141" y="160" width="86" height="24" rx="7" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.4"/>
  <text x="184.0" y="176" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#e2e8f0">JavaScript</text>
  <rect x="235" y="160" width="86" height="24" rx="7" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.4"/>
  <text x="278.0" y="176" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#e2e8f0">Canvas API</text>
  <rect x="329" y="160" width="86" height="24" rx="7" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.4"/>
  <text x="372.0" y="176" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#e2e8f0">Responsive</text>
  <circle cx="870" cy="172" r="3" fill="#22d3ee" filter="url(#glow)"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="860" y="176" text-anchor="end" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#94a3b8">Live on GitHub Pages</text>
</svg>
