<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="PROJECT UNIVERSE">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- index chip -->
  <rect x="0.5" y="14.5" width="54" height="34" rx="8" fill="#0b1220" stroke="url(#g)" stroke-opacity="0.8"/>
  <text x="27.5" y="37" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" font-weight="700" fill="url(#g)">03</text>
  <!-- title -->
  <text x="72" y="39" font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="5" fill="#e2e8f0">PROJECT UNIVERSE</text>
  <!-- trailing line -->
  <rect x="418" y="31" width="482" height="1.5" fill="url(#line)"/>
  <circle cx="418" cy="31.75" r="3" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="cx" values="418;678;418" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
